name: Generate cover images

on:
  push:
    paths:
      - "prompts/**.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-image
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate missing images
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_images.py
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/covers
          git diff --cached --quiet || git commit -m "Add generated cover images"
          git push
