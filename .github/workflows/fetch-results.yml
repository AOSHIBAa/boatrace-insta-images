name: Fetch official race results

on:
  schedule:
    - cron: "17 21 * * *"   # 毎日 6:17 JST
  workflow_dispatch:
    inputs:
      start:
        description: "開始日 YYYY-MM-DD(空なら自動)"
        required: false
      end:
        description: "終了日 YYYY-MM-DD(空なら自動)"
        required: false
  push:
    paths:
      - scripts/fetch_results.py
      - .github/workflows/fetch-results.yml

permissions:
  contents: write

concurrency:
  group: fetch-results
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
      - run: pip install boatrace-lzh
      - name: Connectivity check
        run: curl -sS -o /dev/null -w "%{http_code} %{time_total}s\n" --max-time 30 https://www1.mbrace.or.jp/od2/K/202611/k261103.lzh || true
      - name: Fetch
        run: |
          if [ -n "${{ github.event.inputs.start }}" ]; then
            python -u scripts/fetch_results.py "${{ github.event.inputs.start }}" "${{ github.event.inputs.end }}"
          else
            python -u scripts/fetch_results.py
          fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/results
          git diff --cached --quiet || git commit -m "Add official race results $(date -u +%F)"
          git pull --rebase -q origin main && git push
